---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: azuredevops-deployment
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: azuredevops
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: azuredevops
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: '2'
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/os: linux
      containers:
      - name: azuredevops-container
        image: agent
        # args: ["--once"]
        imagePullPolicy: IfNotPresent
        env:
          - name: AZP_TOKEN
            valueFrom:
              secretKeyRef:
                name: azuredevops
                key: AZP_TOKEN
          - name: AZP_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: azuredevops
                key: AZP_CLIENT_ID
          - name: AZP_SECRET_VALUE
            valueFrom:
              secretKeyRef:
                name: azuredevops
                key: AZP_SECRET_VALUE
          - name: AZP_TENANT_ID
            valueFrom:
              secretKeyRef:
                name: azuredevops
                key: AZP_TENANT_ID
          - name: AZP_URL
            valueFrom:
              configMapKeyRef:
                name: azuredevops
                key: AZP_URL
          - name: AZP_AGENT_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: AZP_POOL
            valueFrom:
              configMapKeyRef:
                name: azuredevops
                key: AZP_POOL
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "3"
            memory: "4096Mi"
        volumeMounts:
          - name: secrets-store-inline
            mountPath: /mnt/secrets-store
            readOnly: true
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: azuredevops-token
